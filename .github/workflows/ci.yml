name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check services tests

      - name: Secret scan (GR-SEC-03)
        run: bash scripts/check_secrets.sh

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Guardrail tests
        run: pytest tests/guardrails -v

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Acceptance tests (Phase 1)
        run: pytest tests/acceptance -v
