<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#075E54" />
  <title>Hermes Assistant</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="avatar">H</div>
      <div class="header-text">
        <h1>Hermes</h1>
        <p class="status">Your personal assistant · Pilot</p>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <footer class="composer">
      <input id="pin" type="password" placeholder="Pilot PIN (if set)" class="pin-input" />
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="Message Hermes…" aria-label="Message"></textarea>
        <button id="send" type="button" aria-label="Send">➤</button>
      </div>
      <p class="hint">Works like WhatsApp — add this page to your home screen for quick access.</p>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
