services:
  pilot-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pilot
    env_file:
      - ../.env
    volumes:
      - pilot_data:/app/data
    ports:
      - "${PILOT_API_BIND:-127.0.0.1:18000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  reminder-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pilot
    env_file:
      - ../.env
    volumes:
      - pilot_data:/app/data
    command: ["python", "-m", "pilot_api.reminder_worker"]
    restart: unless-stopped
    depends_on:
      pilot-api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_HTTP_BIND:-80}:80"
      - "${CADDY_HTTPS_BIND:-443}:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:-internal}
    volumes:
      - ../infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pilot-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pilot_data:
  caddy_data:
  caddy_config:
